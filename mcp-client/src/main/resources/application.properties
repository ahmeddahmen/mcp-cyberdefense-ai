# Nom de l'application
spring.application.name=mcp-client

# Type de client MCP (synchrone)
spring.ai.mcp.client.type=sync

# MCP request timeout (120s to allow port scanning and log analysis)
spring.ai.mcp.client.request-timeout=120000

# Increase HTTP read timeout for long LLM responses
spring.ai.openai.chat.completions-path=/v1/chat/completions
spring.mvc.async.request-timeout=120000
# Increase connection and read timeout for Groq API
spring.ai.openai.connect-timeout=30000
spring.ai.openai.read-timeout=120000

# Point de terminaison SSE du serveur MCP (disabled - no SSE server running)
# spring.ai.mcp.client.sse.connections.server1.url=http://localhost:8877
# spring.ai.mcp.client.sse.connections.server1.sse-endpoint=/sse
spring.ai.mcp.client.stdio.servers-configuration=classpath:mcp-servers.json

# Port local du client
server.port=8066

# ====== Groq (via OpenAI-compatible API) ======

spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile

spring.ai.ollama.enabled=false

