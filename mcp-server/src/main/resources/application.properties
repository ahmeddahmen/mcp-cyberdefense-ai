spring.application.name=mcp-server
# Spring Boot application name

spring.ai.mcp.server.name=spring-mcp-server
# MCP server name for identification in multi-server environments

spring.ai.mcp.server.type=sync
# MCP server operating mode: sync for synchronous processing

spring.ai.mcp.server.sse-endpoint=/sse
# Path for SSE (Server-Sent Events) connections

spring.ai.mcp.server.sse-message-endpoint=/mcp/message
# Endpoint for receiving MCP messages from the client

spring.ai.mcp.server.version=1.0.0
# MCP server version for tracking and compatibility

# Enable prompt change notifications from the server side
spring.ai.mcp.server.prompt-change-notification=true

# Enable tool change notifications from the server side
spring.ai.mcp.server.tool-change-notification=true

# Enable resource change notifications from the server side
spring.ai.mcp.server.resource-change-notification=true

# Enable TRACE logging for the Model Context Protocol
logging.level.io.modelcontextprotocol=TRACE

# Enable TRACE logging for Spring AI MCP components
logging.level.org.springframework.ai.mcp=TRACE

server.port=8877
# HTTP port for the Spring Boot application
